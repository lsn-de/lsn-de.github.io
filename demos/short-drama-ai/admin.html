function filterRows(key,rows){const state=filterState(key),schema=schemaFor(key),term=String(state.q||'').trim().toLowerCase();return rows.filter(r=>{if(term){const fields=schema.searchFields||Object.keys(r);const haystack=fields.map(k=>r[k]??'').join(' ')+' '+(['user','source'].filter(k=>fields.includes(k)||schema.fields.some(f=>f.key===k)).map(k=>names.user(r[k])||'').join(' '))+' '+(schema.searchText?schema.searchText(r):'');if(!haystack.toLowerCase().includes(term))return false}return schema.fields.every(f=>{if(f.kind==='date'||f.kind==='period'){const from=state[f.key+'_from'],to=state[f.key+'_to'];if(!from&&!to)return true;const first=String(r[f.key]||'').slice(0,10),last=f.kind==='period'?String(r[f.endKey]||'').slice(0,10):first;if(!/^\d{4}-\d{2}-\d{2}$/.test(first)||!/^\d{4}-\d{2}-\d{2}$/.test(last))return false;return (!from||last>=from)&&(!to||first<=to)}const selected=state[f.key];if(!selected)return true;const value=f.value?f.value(r):r[f.key];if(selected==='__empty__')return value===undefined||value===null||value==='';if(f.arrayValue)return (value||[]).includes(selected);if(f.multipleValue)return String(value||'').split(',').includes(selected);return String(value??'')===selected})})}
function managedTable(key,cols,rows,actions,opts={}){const schema=schemaFor(key),state=filterState(key),filtered=filterRows(key,rows),total=filtered.length;state.page=Math.max(1,Math.min(state.page||1,Math.ceil(total/size)||1));const controls=schema.fields.map(f=>{if(f.kind==='date'||f.kind==='period')return '<div class="range-filter"><span>'+esc(f.label)+'</span><input type="date" data-filter="'+f.key+'_from" aria-label="'+esc(f.label)+'起始日期" value="'+esc(state[f.key+'_from']||'')+'"><span>至</span><input type="date" data-filter="'+f.key+'_to" aria-label="'+esc(f.label)+'结束日期" value="'+esc(state[f.key+'_to']||'')+'"></div>';return '<label class="filter-control"><span>'+esc(f.label)+'</span><select data-filter="'+f.key+'" aria-label="'+esc(f.label)+'"><option value="">全部'+esc(f.label)+'</option>'+optionsFor(f,state).map(([v,label])=>'<option value="'+esc(v)+'" '+(state[f.key]===v?'selected':'')+'>'+esc(label)+'</option>').join('')+'</select></label>'}).join('');return '<section class="managed-table" data-table="'+esc(key)+'"><div class="filters"><label class="filter-control keyword-control"><span>关键词</span><input type="search" data-filter="q" aria-label="'+esc(schema.search)+'" placeholder="'+esc(schema.search)+'" value="'+esc(state.q||'')+'"></label>'+controls+'<div class="filter-buttons"><button class="primary" data-table-action="query">查询</button><button data-table-action="reset">重置</button></div>'+(opts.new&&can(opts.perm)?'<button class="primary filter-new" data-act="new" data-id="'+esc(key)+'">＋ '+esc(opts.new)+'</button>':'')+'</div><div class="filter-error error" role="status"></div>'+(opts.note?'<div class="note">'+opts.note+'</div>':'')+table(cols,filtered.slice((state.page-1)*size,state.page*size),actions)+'<div class="pagination"><span>共 '+total+' 条记录</span><div><button data-table-action="prev" '+(state.page===1?'disabled':'')+'>‹</button><span style="margin:0 12px">'+state.page+' / '+Math.max(1,Math.ceil(total/size))+'</span><button data-table-action="ne function runTableAction(element,action){const box=element.closest('[data-table]');if(!box)return;const key=box.dataset.table;if(action==='reset')tableFilterState[key]={q:'',page:1};else if(action==='prev'||action==='next'){filterState(key).page+=action==='prev'?-1:1}else{const next={q:'',page:1};box.querySelectorAll('[data-filter]').forEach(el=>next[el.dataset.filter]=el.value.trim());const schema=schemaFor(key);for(const f of schema.fields){if((f.kind==='date'||f.kind==='period')&&next[f.key+'_from']&&next[f.key+'_to']&&next[f.key+'_from']>next[f.key+'_to']){box.querySelector('.filter-error').textContent=f.label+'：起始日期不能晚于结束日期';return}if(f.dependent&&next[f.key]&&!optionsFor(f,next).some(([v])=>v===next[f.key]))next[f.key]=''}tableFilterState[key]=next}refreshManagedTable(box)}
