/* Homepage only: banner and four independent three-card sections. */
.home-page .topbar{height:54px}
.home-page .home-banner{display:block;position:relative;width:calc(100% - 40px);aspect-ratio:2/1;margin:0 20px;padding:0;border-radius:12px;overflow:hidden;text-align:left;background:var(--surface);isolation:isolate}
.home-page .home-banner>img{width:100%;height:100%;object-fit:cover;object-position:center 50%;filter:brightness(.7)}
.home-page .home-banner:after{content:'';position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,oklch(.10 .008 275/.92),oklch(.10 .008 275/.18))}
.home-page .home-banner-copy{position:absolute;left:16px;right:58px;bottom:17px;z-index:1;display:block}
.home-page .home-banner-copy .kicker{font-size:10px;color:var(--fg)}
.home-page .home-banner-title{display:block;font:600 27px/1.4 var(--display);letter-spacing:0;margin:4px 0}
.home-page .home-banner-sub{font-size:11px;color:var(--fg);line-height:1.7}
.home-page .home-banner-play{position:absolute;right:16px;bottom:21px;z-index:1;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--muted);border-radius:50%;background:oklch(.12 .008 275/.8);color:var(--fg)}
.home-page .home-banner-play svg{width:16px;height:16px}
.home-page .home-banner:hover{box-shadow:0 0 0 1px var(--muted);color:var(--fg)}
.home-page .home-sections{padding:0 20px 12px}
.home-page .home-section{margin-top:17px}
.home-page .home-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:8px}
.home-page .home-section-head h2{font-size:17px;line-height:1.4}
.home-page .home-section-head button{min-height:44px;padding:0 0 0 10px;font-size:11px;color:var(--muted);border-radius:6px}
.home-page .home-section-head button span{margin-left:4px;font-size:15px}
.home-page .home-section-head button:hover{color:var(--fg);background:var(--surface)}
.home-page .home-card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.home-page .home-card{min-width:0;padding:0 0 5px;border-radius:9px;text-align:left;color:var(--fg)}
.home-page .home-card-cover{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:9px;background:var(--surface)}
.home-page .home-card-cover>img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.home-page .home-card h3{font-size:12px;font-weight:550;line-height:1.6;margin-top:7px;overflow-wrap:anywhere}
.home-page .home-card small{display:block;font-size:10px;margin-top:2px;line-height:1.5}
.home-page .home-card:hover{background:var(--surface);color:var(--fg);box-shadow:0 0 0 2px var(--border)}
.home-page .home-cover-mark{position:absolute;bottom:7px;right:7px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:oklch(.1 .008 275/.85);border:1px solid oklch(.7 .012 275/.5);color:var(--fg);box-shadow:0 2px 8px oklch(0 0 0/.3)}
.home-page .home-cover-mark svg{width:12px;height:12px}
.home-page .home-disclaimer{font-size:10px;line-height:1.8;color:var(--muted);margin-top:22px}

/* AI task history only; preserve existing phone and wide-screen layouts. */
.face-history-entry{min-height:44px;padding:6px 8px;font-size:11px;color:var(--fg);border:1px solid var(--border);border-radius:8px;flex-shrink:0}
.face-history-notice{padding:14px 16px;margin:8px 0 14px;background:oklch(.23 .045 24);border:1px solid oklch(.45 .09 24);border-radius:10px;color:var(--fg);font-size:13px;line-height:1.8}
.face-history-help{display:block;margin-bottom:18px}
.face-history-record{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--surface);margin-bottom:12px;min-width:0}
.face-history-summary{display:flex;align-items:center;gap:12px}

 records.forEach(t=>{const elapsed=now-t.at;if(t.status==='排队中'&&elapsed>=2200)t.status='处理中';if(t.status==='处理中'&&elapsed>=6200)t.status='完成'});

let authMode='login',authMethod='email';
const authDraft={email:'',phone:'',code:'',nickname:'',invite:'',gender:state.gender||state.auth?.gender||'',agreed:false,codeSent:false};
function openAuth(){authDraft.code='';authDraft.codeSent=false;authDraft.gender=state.gender||state.auth?.gender||'';authDraft.agreed=false;authMode='login';go('login')}
function changeAuthMode(mode){authMode=mode;authDraft.code='';authDraft.codeSent=false;render()}
function changeAuthMethod(method){authMethod=method;authDraft.code='';authDraft.codeSent=false;render()}
function authError(message){const error=document.getElementById('auth-error');if(error)error.textContent=message}
function validAuthAccount(){
 const value=authDraft[authMethod].trim();
 return authMethod==='email'?/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value):/^\+?[\d\s-]{6,20}$/.test(value)&&value.replace(/\D/g,'').length>=6;
}
function sendAuthCode(){
 if(!validAuthAccount()){authError(authMethod==='email'?'请输入有效邮箱':'请输入有效手机号，支持国家区号');return}
 authDraft.codeSent=true;authError('');document.getElementById('auth-code-note').textContent='演示验证码：123456';
}
function authGenderFields(){return `<fieldset class="auth-gender"><legend>性别 <small>选填</small></legend><div>${['男','女','跨性别'].map(value=>`<label><input type="radio" name="auth-gender" value="${value}" ${authDraft.gender===value?'checked':''} onchange="authDraft.gender=this.value"><span>${value}</span></label>`).join('')}</div></fieldset>`}
function login(){
 const register=authMode==='register';
 return `<div class="auth-page"><header class="topbar"><button type="button" class="iconbtn" onclick="back()" aria-label="返回">${I('back')}</button></header><div class="auth-content"><div class="brand"><span class="logo">h</span>红果娱乐</div><h1>${register?'创建账号':'欢迎回来'}</h1><nav class="auth-mode" aria-label="登录注册"><button type="button" class="${!register?'selected':''}" aria-pressed="${!register}" onclick="changeAuthMode('login')">登录</button><button type="button" class="${register?'selected':''}" aria-pressed="${register}" onclick="changeAuthMode('register')">注册</button></nav><form onsubmit="event.preventDefault();submitAuth()" novalidate><div class="auth-method" aria-label="登录方式">${[['email','邮箱'],['phone','手机号']].map(([method,label])=>`<button type="button" class="${authMethod===method?'selected':''}" aria-pressed="${authMethod===method}" onclick="changeAuthMethod('${method}')">${label}</button>`).join('')}</div><label class="auth-field"><span>${authMethod==='email'?'邮箱':'手机号'}</span><input id="auth-account" type="${authMethod==='email'?'email':'tel'}" autocomplete="${authMethod==='email'?'email':'tel'}" placeholder="${authMethod==='email'?'请输入邮箱':'请输入手机号（含国家区号）'}" value="${esc(authDraft[authMethod])}" oninput="authDraft[authMethod]=this.value;authDraft.codeSent=false;document.getElementById('auth-code-note').textContent='';authError('')"></label><label class="auth-field"><span>验证码</span><div class="auth-code-field"><input id="auth-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="请输入验证码" value="${esc(authDraft.code)}" oninput="authDraft.code=this.value;authError('')"><button type="button" onclick="sendAuthCode()">获取验证码</button></div></label><small id="auth-code-note">${authDraft.codeSent?'演示验证码：123456':''}</small>${register?`<label class="auth-field"><span>昵称 <small>选填</small></span><input id="auth-nickname" maxlength="20" placeholder="请输入昵称" value="${esc(authDraft.nickname)}" oninput="authDraft.nickname=this.value"></label><label class="auth-field"><span>邀请码 <small>选填</small></span><input id="auth-invite" maxlength="20" placeholder="请输入邀请码" value="${esc(authDraft.invite)}" oninput="authDraft.invite=this.value;authError('')"></label>`:''}${authGenderFields()}<div class="auth-agreement"><input id="auth-agreed" type="checkbox" ${authDraft.agreed?'checked':''} onchange="authDraft.agreed=this.checked;authError('')"><div><label for="auth-agreed">我已阅读并同意</label><button type="button" onclick="info('用户协议','用户协议正文待配置。')">《用户协议》</button><button type="button" onclick="info('隐私政策','隐私政策正文待配置。')">《隐私政策》</button></div></div><p id="auth-error" class="auth-error" role="alert"></p><button type="submit" class="primary wide" data-od-id="auth-submit">${register?'注册并登录':'登录'}</button></form><div class="auth-third-party"><p>其他登录方式</p><div>${['Facebook','X','Google'].map(provider=>`<button type="button" class="secondary" onclick="startThirdPartyAuth('${provider}')">${provider}</button>`).join('')}</div></div><p class="auth-demo-note">原型演示：验证码123456，不发送短信或邮件；第三方登录仅模拟授权。</p></div></div>`;
}
function submitAuth(){
 if(!validAuthAccount())return authError(authMethod==='email'?'请输入有效邮箱':'请输入有效手机号，支持国家区号');
 if(!authDraft.codeSent)return authError('请先获取验证码');
 if(authDraft.code!=='123456')return authError('验证码不正确');
 if(!authDraft.agreed)return authError('请先阅读并同意用户协议和隐私政策');
 if(authMode==='register'&&authDraft.invite.trim()&&authDraft.invite.trim().toUpperCase()!=='HG8K26')return authError('演示邀请码无效，可留空或输入 HG8K26');
 completeAuth(authMethod,authDraft[authMethod].trim());
}
function startThirdPartyAuth(provider){
 if(!['Facebook','X','Google'].includes(provider))return;
 if(!authDraft.agreed)return authError('请先阅读并同意用户协议和隐私政策');
 authError('');modal(provider+' 登录',`<p>确认使用 ${provider} 模拟账号登录？</p><div class="redeem-actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="completeAuth('${provider}','${provider}演示账号')">确认模拟登录</button></div>`);
}
function completeAuth(method,account){
 const gender=['男','女','跨性别'].includes(authDraft.gender)?authDraft.gender:(state.gender||'');
 state.gender=gender;state.auth={loggedIn:true,method,account,gender,nickname:authDraft.nickname.trim()||state.auth?.nickname||'海边的旅人'};
 if(authMode==='register'&&authDraft.invite.trim()&&!state.inviterCode)state.inviterCode=authDraft.invite.trim().toUpperCase();
 save();authDraft.code='';closeModal();stack=[];go('me',true);
}
function logoutAuth(){if(state.auth)state.auth.loggedIn=false;save();authDraft.code='';authDraft.agreed=false;closeModal();tab('me')}

// Desktop mouse controls complement native touch scrolling on template tags.
let faceTagDrag=null,faceTagBlockedClick=null;
document.addEventListener('pointerdown',event=>{
 faceTagBlockedClick=null;
 const nav=event.target.closest('.face-filter-tabs');
 if(event.pointerType!=='mouse'||event.button!==0||!nav||nav.scrollWidth<=nav.clientWidth+1)return;
 faceTagDrag={nav,id:event.pointerId,x:event.clientX,scroll:nav.scrollLeft,moved:false};
});
document.addEventListener('pointermove',event=>{
 const drag=faceTagDrag;if(!drag||event.pointerId!==drag.id)return;
 const delta=event.clientX-drag.x;
 if(!drag.moved&&Math.abs(delta)<5)return;
 if(!drag.moved){drag.moved=true;drag.nav.classList.add('dragging');drag.nav.setPointerCapture(event.pointerId)}
 event.preventDefault();drag.nav.scrollLeft=drag.scroll-delta;
});
function finishFaceTagDrag(event){
 const drag=faceTagDrag;if(!drag||event.pointerId!==drag.id)return;
 drag.nav.classList.remove('dragging');
 if(drag.moved)faceTagBlockedClick={nav:drag.nav,until:performance.now()+300};
 faceTagDrag=null;
}
document.addEventListener('pointerup',finishFaceTagDrag);
document.addEventListener('pointercancel',finishFaceTagDrag);
document.addEventListener('click',event=>{
 const block=faceTagBlockedClick;
 if(event.detail&&block&&performance.now()<block.until&&block.nav.contains(event.target)){event.preventDefault();event.stopImmediatePropagation();faceTagBlockedClick=null}
},true);
document.addEventListener('wheel',event=>{
 const nav=event.target.closest('.face-filter-tabs');
 if(!nav||event.ctrlKey||event.deltaX||!event.deltaY||nav.scrollWidth<=nav.clientWidth+1)return;
 const before=nav.scrollLeft,scale=event.deltaMode===1?16:event.deltaMode===2?nav.clientWidth:1;
 nav.scrollLeft+=event.deltaY*scale;if(nav.scrollLeft!==before)event.preventDefault();
},{passive:false});
</script>
